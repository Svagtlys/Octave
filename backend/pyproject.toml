[project]
name = "octave-backend"
version = "0.1.0"
description = "Octave backend service"
requires-python = ">=3.12"
dependencies = [
    # Versions below are pinned by the Task 1 spike resolutions.
    "alembic>=1.20.0",
    "aiosqlite>=0.22.1",
    "fastapi>=0.115.0",
    # Spike in Task 1 Step 3 pins the resolved version; the SDK moves fast and
    # streamablehttp_client + memory-stream test helpers must exist.
    # <2.0.0: SDK 2.x renamed streamablehttp_client and moved its wire layer to
    # the httpx2 fork; this plan targets the 1.x API.
    "mcp>=1.30.0,<2.0.0",
    # <3.0: SDK 3.x switched its wire layer to the `httpx2` fork, breaking the
    # injected-httpx-client test seam the adapter relies on.
    "openai>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0",
    # vec0 vector index for SQLite. Pinned by the Task 1 spike (0.1.9): the
    # vec0 KNN syntax and serialize_float32 helper are relied on in
    # sqlite_adapter.py. Spike A showed the connect-event unwrap path raises a
    # threading ProgrammingError under aiosqlite; the adapter loads the
    # extension via async_creator instead (Variant B).
    "sqlite-vec>=0.1.9",
    # async engine + 2.0 typed ORM declarative base (spike: 2.0.52).
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/octave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Autogenerate output is regenerated, not hand-edited; its formatting is
# Alembic's, not ours.
"src/octave/db/migrations/versions/*" = ["E501", "I001", "W291", "E402"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# sqlite-vec ships no py.typed marker; its surface (load, loadable_path,
# serialize_float32) is small and relied on as-is.
module = ["sqlite_vec.*"]
ignore_missing_imports = true
